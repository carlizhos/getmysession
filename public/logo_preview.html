<!DOCTYPE html>
<html>
<head>
  <title>Logo Preview</title>
  <style>
    body { 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      margin: 0; 
      background: #f1f5f9; 
      font-family: system-ui, sans-serif;
      flex-direction: column;
      gap: 32px;
    }
    .preview-row {
      display: flex;
      gap: 40px;
      align-items: center;
    }
    .preview-box {
      text-align: center;
    }
    .preview-box p {
      margin-top: 12px;
      color: #64748b;
      font-size: 14px;
    }
    img { border-radius: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
  </style>
</head>
<body>
  <h1 style="color: #1e293b;">Logo Preview — GetMySession</h1>
  <div class="preview-row">
    <div class="preview-box">
      <img src="/getmysession_logo.svg" width="128" height="128" alt="Logo 128px">
      <p>128 × 128</p>
    </div>
    <div class="preview-box">
      <img src="/getmysession_logo.svg" width="80" height="80" alt="Logo 80px">
      <p>80 × 80</p>
    </div>
    <div class="preview-box">
      <img src="/getmysession_logo.svg" width="48" height="48" alt="Logo 48px">
      <p>48 × 48</p>
    </div>
    <div class="preview-box">
      <img src="/getmysession_logo.svg" width="32" height="32" alt="Logo 32px">
      <p>32 × 32</p>
    </div>
  </div>
  <p style="color: #94a3b8; font-size: 13px;">Abre <strong>http://localhost:8099/logo_preview.html</strong> para ver este preview</p>
</body>
</html>
